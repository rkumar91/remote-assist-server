# Koyeb deployment definition for RemoteAssist WebSocket Relay Server
type: api
name: remote-assist-server
routes:
  - path: /
    port: 9090
ports:
  - port: 9090
    protocol: http
instance_types:
  - type: free
health_checks:
  - http:
      path: /
      port: 9090
    interval: 30
    timeout: 5
